{% for message in messages %}
    <div id="message-{{ message.id }}" class="rounded-2xl border border-border/70 bg-background/65 p-4">
        <div class="flex items-center justify-between gap-3">
            <p class="font-semibold">{{ message.author.username }}</p>
            <p class="text-xs text-muted-foreground">{{ message.created_at|date:"d M Y H:i" }}</p>
        </div>
        <p class="mt-3 text-sm leading-7 text-muted-foreground">{{ message.content }}</p>
    </div>
{% endfor %}
