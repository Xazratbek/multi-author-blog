{% extends "base.html" %}

{% block title %}Signed Out{% endblock %}
{% block page_heading %}Session ended{% endblock %}

{% block content %}
<section class="mx-auto w-full max-w-2xl">
    <c-card class="border-border/70 bg-card/90 p-8 text-center shadow-xl shadow-black/5">
        <h2 class="font-display text-3xl font-bold tracking-tight">You are signed out</h2>
        <p class="mt-3 text-sm leading-7 text-muted-foreground">Istalgan payt qayta kirib, yozish va profilingizni davom ettirishingiz mumkin.</p>
        <a href="{% url 'login' %}" class="mt-6 inline-flex items-center rounded-xl bg-primary px-5 py-3 text-sm font-semibold text-primary-foreground shadow-lg shadow-primary/20 transition hover:bg-primary/90">Sign In Again</a>
    </c-card>
</section>
{% endblock %}
